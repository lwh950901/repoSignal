# 最小验证版：定时任务「每次触发新建会话」
#
# 这是 dsh-plugins/fresh-session-min 的配置。改完这个文件需要让插件重新加载
# （插件页里重装一次，或重启 DeepSeek Harness）。
- insert:
    - id: fresh-session-min
      name: '@local/dsh-fresh-session-min'
      config:
        # 任务名；同时作为新会话标题前缀（标题 = "{title} {YYYY-MM-DD}"）
        title: 最小版验证任务
        # 新会话所属工作区 id（repo-signal）
        workspaceId: 3d0269e2-3e85-4e5e-b784-30f1837184f2
        # 每天触发时刻，本机时区（Asia/Shanghai）
        timeOfDay: '06:30'
        # 验证用：true 时插件加载后立刻跑一次（正式使用请改回 false）
        runOnStart: true
        # 回执发到哪里：留空则不发回执。
        # 这里填的是当前这个对话，方便你直接看到效果。
        receiptSessionId: session-53a154fd-a25b-4de1-b3b9-71caddeecc31
        # 投递给新会话的提示词。验证阶段刻意用一句轻量任务，避免真跑一遍可行性分析。
        prompt: |-
          这是一次定时任务插件的机制验证。请只回复一句话：说明你收到了定时投递、当前工作目录是什么。
          不要读取任何文件，不要调用任何工具。
